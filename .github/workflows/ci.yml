name: CI/CD Pipeline

on:
  push:
    branches: [dev, stage]
  pull_request:
    branches: [dev, stage]

env:
  REGISTRY_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=${{ github.ref_name }}-latest
            type=raw,value=${{ github.ref_name }}-${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL_START }}${{ github.ref_name }}${{ vars.VITE_API_URL_END }}
          cache-from: type=registry,ref=${{ env.REGISTRY_IMAGE }}:${{ github.ref_name }}-buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY_IMAGE }}:${{ github.ref_name }}-buildcache,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/garden-nook/docker/${{ github.ref_name }}
            docker compose pull
            FRONT_IMAGE_TAG=${{ github.ref_name }}-${{ github.sha }} docker compose up -d --remove-orphans
            docker image prune -f
            echo "Deployed ${{ github.ref_name }}-${{ github.sha }}"
